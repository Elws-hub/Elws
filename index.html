        .container {
            max-width: 520px;

        .profile {
            text-align: center;
            margin-bottom: 25px;
        }

        .profile-photo {
            width: 95px;
            height: 95px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
            margin-bottom: 15px;
            border: 4px solid white;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        .profile h1 {
            font-size: 30px;
            margin-bottom: 6px;
        }

        .profile p {
            color: #777;
            font-size: 14px;
        }

        /* TOKO UTAMA */
        .main-store {
            display: block;
            background: #222;
            color: white;
            padding: 16px;
            margin: 20px 0;
            border-radius: 14px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
            transition: 0.2s;
        }

        .main-store:hover {
            transform: translateY(-3px);
            background: #444;
        }

        /* SOCIAL MEDIA */
        .social {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0 30px;
        }

        .social a {
            text-decoration: none;
            background: white;
            color: #222;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
            transition: 0.2s;
        }

        .social a:hover {
            transform: translateY(-3px);
        }

        /* SECTION TITLE */
        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        /* CATEGORY */
        .categories {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-bottom: 35px;
        }

        .category {
            background: white;
            padding: 15px;
            border-radius: 14px;
            text-decoration: none;
            color: #222;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
            transition: 0.2s;
        }

        .category:hover {
            transform: translateY(-3px);
        }

        /* PRODUCT GRID */
        .products {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
            margin-bottom: 35px;
            align-items: start;
        }

        .product {
            min-width: 0;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 18px rgba(0, 0, 0, 0.08);
            transition: 0.2s;
        }

        .product:hover {
            transform: translateY(-4px);
        }

        /* FOTO PRODUK 9:16 */
        .product-image {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 16;
            height: auto;
            object-fit: contain;
            object-position: center;
            background: #fff;
            padding: 4px;
        }

        /* SLIDESHOW SENKA 9:16 */
        .senka-slideshow {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            background: #fff;
        }

        .senka-slide {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            padding: 4px;
            opacity: 0;
            transition: opacity 0.7s ease-in-out;
        }

        .senka-slide.active {
            opacity: 1;
        }

        .slide-indicators {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            padding: 10px 0 5px;
            background: #fff;
        }

        .slide-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #d0d0d0;
            transition: background 0.3s;
        }

        .slide-dot.active {
            background: #222;
        }

        /* PRODUCT INFO */
        .product-info {

        }

        .product-name {

        }

        .product-desc {

        }

        .product-price {

        }

            font-weight: bold;
            transition: 0.2s;
        }

        .buy-button:hover {
            background: #444;
        }

        }

        /* FOOTER */
        .footer {

            border-top: 1px solid #e5e5e5;
            color: #777;

            line-height: 1.8;
        }

        .footer-connect h3 {

            flex-wrap: wrap;
            gap: 8px;
            text-align: center;
        }

        .footer-links a {
            color: #666;
            text-decoration: none;
        }

        .footer-links a:hover {
            color: #111;
            text-decoration: underline;
        }

        .footer-brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .footer-brand h3 {
            font-size: 25px;
            color: #222;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .footer-brand p {
            font-size: 13px;
            color: #888;
        }

        .footer-legal {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            text-align: center;
            margin-bottom: 20px;
        }

        .footer-legal a {
            color: #666;

        }

        .footer-legal a:hover {
            color: #111;
            text-decoration: underline;
        }

        .footer-copyright {
            border-top: 1px solid #e5e5e5;
            padding-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }

        /* MOBILE */
        @media (max-width: 400px) {
            body {
                padding: 25px 12px;
            }

                font-size: 26px;
            }

            .category {
                padding: 13px 8px;

                gap: 10px;

                font-size: 11px;

            .product-price {
                font-size: 14px;
            }

            .buy-button {

            .footer-legal {
                gap: 6px;
                font-size: 12px;
            }
        }
    </style>
</head>
