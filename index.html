<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elws. | Beauty, Fashion & Lifestyle</title>

    <meta
        name="description"
        content="Temukan inspirasi beauty, fashion, lifestyle, dan rekomendasi produk pilihan untuk keseharianmu di Elws."
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: 20px;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f8f8f8;
            color: #222;
        }

        a {
            -webkit-tap-highlight-color: transparent;
        }

        /* HEADER */
        header {
            text-align: center;
            padding: 35px 15px 25px;
            background: #fff;
        }

        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #eee;
        }

        header h1 {
            margin: 12px 0 5px;
            font-size: 27px;
            letter-spacing: 1px;
        }

        header p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .main-button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #222;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 14px;
            transition: background 0.2s;
        }

        .main-button:hover,
        .buy-button:hover {
            background: #555;
        }

        .social-links {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .social-links a {
            color: #333;
            text-decoration: none;
            font-size: 13px;
            border: 1px solid #ddd;
            padding: 8px 14px;
            border-radius: 20px;
        }

        /* MAIN CONTENT */
        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 15px 45px;
        }

        /* CATEGORY MENU */
        .category-menu {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 35px;
        }

        .category-menu a {
            display: inline-block;
            background: #fff;
            color: #333;
            text-decoration: none;
            border: 1px solid #e5e5e5;
            padding: 10px 15px;
            border-radius: 22px;
            font-size: 13px;
        }

        .category-menu a:hover {
            background: #222;
            color: #fff;
        }

        /* SECTION */
        .product-section {
            margin-bottom: 38px;
        }

        .section-title {
            font-size: 21px;
            margin: 0 0 17px;
        }

        /* PRODUCT GRID */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .product {
            min-width: 0;
            overflow: hidden;
            background: #fff;
            border: 1px solid #eee;
            border-radius: 12px;
        }

        /*
           SENKA SLIDESHOW
           Area gambar menggunakan rasio 9:16.
           object-fit: contain menjaga seluruh gambar tetap terlihat.
        */
        .senka-slideshow {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            overflow: hidden;
            background: #fff;
        }

        .senka-slide {
            position: absolute;
            inset: 0;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            padding: 5px;
            opacity: 0;
            transition: opacity 0.7s ease-in-out;
        }

        .senka-slide.active {
            opacity: 1;
        }

        .slide-indicators {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
            padding: 10px 0 5px;
            background: #fff;
        }

        .slide-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #d0d0d0;
            transition: background 0.3s;
        }

        .slide-dot.active {
            background: #222;
        }

        /* OTHER PRODUCT IMAGES */
        .product-image {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 16;
            height: auto;
            object-fit: contain;
            object-position: center;
            padding: 5px;
            background: #fff;
        }

        /* PRODUCT DETAILS */
        .product-info {
            padding: 13px;
        }

        .product-info h3 {
            margin: 0 0 8px;
            font-size: 15px;
            line-height: 1.5;
        }

        .product-info p {
            margin: 0 0 14px;
            font-size: 12px;
            line-height: 1.6;
            color: #666;
        }

        .buy-button {
            display: block;
            width: 100%;
            padding: 11px 8px;
            background: #222;
            color: #fff;
            text-decoration: none;
            text-align: center;
            border-radius: 7px;
            font-size: 12px;
            line-height: 1.4;
            transition: background 0.2s;
        }

        /* EMPTY CATEGORY */
        .empty-section {
            padding: 25px 15px;
            background: #fff;
            border: 1px dashed #ddd;
            border-radius: 10px;
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            text-align: center;
        }

        /* FOOTER */
        .site-footer {
            background: #fff;
            border-top: 1px solid #eee;
            padding: 42px 20px 25px;
            text-align: center;
            color: #333;
        }

        .footer-about,
        .footer-connect,
        .footer-brand {
            max-width: 600px;
            margin: 0 auto 28px;
        }

        .footer-about h2 {
            font-size: 22px;
            margin: 0 0 13px;
        }

        .footer-about p {
            max-width: 550px;
            margin: 0 auto;
            font-size: 14px;
            line-height: 1.9;
            color: #666;
        }

        .footer-connect h3 {
            font-size: 16px;
            margin: 0 0 13px;
        }

        .footer-links,
        .footer-legal {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 9px;
            font-size: 13px;
        }

        .footer-links a,
        .footer-legal a {
            color: #555;
            text-decoration: none;
        }

        .footer-links a:hover,
        .footer-legal a:hover {
            color: #000;
            text-decoration: underline;
        }

        .footer-brand h3 {
            margin: 0 0 8px;
            font-size: 27px;
            letter-spacing: 1px;
        }

        .footer-brand p {
            margin: 0;
            font-size: 13px;
            color: #777;
        }

        .footer-legal {
            margin-bottom: 22px;
        }

        .footer-copyright {
            border-top: 1px solid #eee;
            padding-top: 20px;
            font-size: 12px;
            line-height: 1.7;
            color: #888;
        }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            header {
                padding-top: 28px;
            }

            .container {
                padding: 20px 12px 35px;
            }

            .product-grid {
                gap: 10px;
            }

            .product-info {
                padding: 10px;
            }

            .product-info h3 {
                font-size: 13px;
            }

            .product-info p {
                font-size: 11px;
            }

            .buy-button {
                font-size: 11px;
            }

            .section-title {
                font-size: 19px;
            }

            .category-menu {
                gap: 8px;
            }

            .category-menu a {
                padding: 9px 11px;
                font-size: 12px;
            }

            .site-footer {
                padding: 33px 16px 22px;
            }

            .footer-about p {
                font-size: 13px;
            }

            .footer-legal {
                gap: 7px;
                font-size: 12px;
            }
        }
    </style>
</head>
